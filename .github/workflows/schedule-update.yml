name: Schedule source update

on:
  schedule:
    # Discord publishes the iOS App Store build on Monday at about 18:10 UTC.
    - cron: "10 18 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch the updater immediately for a scheduler test
        required: false
        default: false
        type: boolean

permissions:
  actions: write

concurrency:
  group: discord-source-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Monday update
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] && [ "$FORCE" != "true" ]; then
            echo "Manual scheduler check complete. Use force=true to dispatch the updater."
            exit 0
          fi

          today=$(date -u +%F)
          already_dispatched=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow update-source.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json createdAt | jq --arg today "$today" '[.[] | select(.createdAt | startswith($today))] | length')
          if [ "$FORCE" != "true" ] && [ "$already_dispatched" -gt 0 ]; then
            echo "Updater already dispatched on $today."
            exit 0
          fi

          gh workflow run update-source.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched the updater for $today."
