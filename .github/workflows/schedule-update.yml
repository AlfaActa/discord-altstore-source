name: Schedule source update

on:
  schedule:
    # GitHub cron has no random operator. This lightweight check selects one
    # pseudorandom 15-minute slot on Friday each week.
    - cron: "*/15 * * * 5"
  workflow_dispatch:
    inputs:
      force:
        description: Dispatch the updater immediately for a scheduler test
        required: false
        default: false
        type: boolean

permissions:
  actions: write

concurrency:
  group: discord-source-scheduler
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Select weekly slot
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" != "true" ]; then
            echo "Manual scheduler check complete. Use force=true to dispatch the updater."
            exit 0
          fi

          week=$(date -u +%G-%V)
          seed=$(printf '%s' "$week" | sha256sum | cut -c1-16)
          target_slot=$((16#${seed:0:8} % 96))
          current_day=$(date -u +%u)
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          current_slot=$((10#$hour * 4 + 10#$minute / 15))

          if [ "$FORCE" != "true" ] && [ "$current_day" -ne 5 ]; then
            echo "Not Friday in UTC."
            exit 0
          fi

          if [ "$FORCE" != "true" ] && [ "$current_slot" -lt "$target_slot" ]; then
            echo "No dispatch for ISO week $week."
            exit 0
          fi

          today=$(date -u +%F)
          already_dispatched=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow update-source.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json createdAt | jq --arg today "$today" '[.[] | select(.createdAt | startswith($today))] | length')
          if [ "$FORCE" != "true" ] && [ "$already_dispatched" -gt 0 ]; then
            echo "Updater already dispatched on $today."
            exit 0
          fi

          gh workflow run update-source.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched the updater for ISO week $week."
