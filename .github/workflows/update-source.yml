name: Update source

on:
  schedule:
    # GitHub cron has no random operator. Wake every 15 minutes and run one
    # deterministic slot selected from Wednesday through Friday each week.
    - cron: "*/15 * * * 3-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-source-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Select weekly slot
        id: slot
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week=$(date -u +%G-%V)
          seed=$(printf '%s' "$week" | sha256sum | cut -c1-16)
          target_day=$((3 + (16#${seed:0:8} % 3)))
          target_slot=$((16#${seed:8:8} % 96))
          current_day=$(date -u +%u)
          hour=$(date -u +%H)
          minute=$(date -u +%M)
          current_slot=$((10#$hour * 4 + 10#$minute / 15))

          if [ "$current_day" -eq "$target_day" ] && [ "$current_slot" -eq "$target_slot" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.slot.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.slot.outputs.run == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt
        if: steps.slot.outputs.run == 'true'

      - name: Download and prepare source update
        id: update
        if: steps.slot.outputs.run == 'true'
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          EEVEE_BOT_ID: ${{ vars.EEVEE_BOT_ID }}
        run: python updater.py update "https://apps.apple.com/us/app/discord-talk-play-hang-out/id985746746"

      - name: Publish IPA release
        if: steps.slot.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.update.outputs.tag }}
          ASSET_PATH: ${{ steps.update.outputs.asset_path }}
          ASSET_NAME: ${{ steps.update.outputs.asset_name }}
          VERSION: ${{ steps.update.outputs.version }}
          BUILD: ${{ steps.update.outputs.build }}
          SHA256: ${{ steps.update.outputs.sha256 }}
          RELEASE_NOTES: ${{ steps.update.outputs.release_notes }}
        shell: bash
        run: |
          release_notes_body=$(printf '%s\n\nSHA-256: %s' "$RELEASE_NOTES" "$SHA256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest")
            if [ -z "$remote_digest" ] || [ "$remote_digest" = "null" ]; then
              gh release upload "$TAG" "$ASSET_PATH"
            elif [ "$remote_digest" != "sha256:$SHA256" ]; then
              echo "Existing release asset checksum does not match." >&2
              exit 1
            fi
            existing_notes=$(gh release view "$TAG" --json body --jq .body)
            if [ "$existing_notes" != "$release_notes_body" ]; then
              gh release edit "$TAG" --notes "$release_notes_body"
            fi
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "Discord $VERSION ($BUILD)" \
              --notes "$release_notes_body"
          fi

      - name: Commit source update
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
          BUILD: ${{ steps.update.outputs.build }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore(source): add Discord $VERSION ($BUILD)"
          git push
