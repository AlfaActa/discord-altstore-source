name: Update source

on:
  schedule:
    # Replaced by the workflow after each scheduled run. This is the first
    # pseudorandom slot for the next ISO week.
    - cron: "32 19 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-source-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: python -m pip install --disable-pip-version-check --requirement requirements.txt

      - name: Download and prepare source update
        id: update
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          EEVEE_BOT_ID: ${{ vars.EEVEE_BOT_ID }}
        run: python updater.py update "https://apps.apple.com/us/app/discord-talk-play-hang-out/id985746746"

      - name: Publish IPA release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.update.outputs.tag }}
          ASSET_PATH: ${{ steps.update.outputs.asset_path }}
          ASSET_NAME: ${{ steps.update.outputs.asset_name }}
          VERSION: ${{ steps.update.outputs.version }}
          BUILD: ${{ steps.update.outputs.build }}
          SHA256: ${{ steps.update.outputs.sha256 }}
          RELEASE_NOTES: ${{ steps.update.outputs.release_notes }}
        shell: bash
        run: |
          release_notes_body=$(printf '%s\n\nSHA-256: %s' "$RELEASE_NOTES" "$SHA256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
              --jq ".assets[] | select(.name == \"$ASSET_NAME\") | .digest")
            if [ -z "$remote_digest" ] || [ "$remote_digest" = "null" ]; then
              gh release upload "$TAG" "$ASSET_PATH"
            elif [ "$remote_digest" != "sha256:$SHA256" ]; then
              echo "Existing release asset checksum does not match." >&2
              exit 1
            fi
            existing_notes=$(gh release view "$TAG" --json body --jq .body)
            if [ "$existing_notes" != "$release_notes_body" ]; then
              gh release edit "$TAG" --notes "$release_notes_body"
            fi
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "Discord $VERSION ($BUILD)" \
              --notes "$release_notes_body"
          fi

      - name: Commit source update
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
          BUILD: ${{ steps.update.outputs.build }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json
          git commit -m "chore(source): add Discord $VERSION ($BUILD)"
          git push

      - name: Schedule next weekly slot
        if: always() && github.event_name == 'schedule'
        shell: bash
        run: |
          week=$(date -u -d 'next week' +%G-%V)
          seed=$(printf '%s' "$week" | sha256sum | cut -c1-16)
          target_day=$((3 + (16#${seed:0:8} % 3)))
          target_hour=$((16#${seed:8:4} % 24))
          target_minute=$((16#${seed:12:4} % 60))
          next_cron="$target_minute $target_hour * * $target_day"
          sed -i -E "s|^    - cron: \".*\"$|    - cron: \"$next_cron\"|" .github/workflows/update-source.yml
          if git diff --quiet -- .github/workflows/update-source.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/update-source.yml
          git commit -m "chore(schedule): set next update slot"
          git push
